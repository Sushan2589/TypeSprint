
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeSprint — Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>Type<span>Sprint</span></h1>
            <p>Test your typing speed.</p>
        </header>

        <section class="test-box">
            <div class="test-info">
                <span id="timer">60s</span>
                <span id="wpm">0 WPM</span>
                <span id="accuracy">100% Accuracy</span>
            </div>

            <div id="quote" class="quote">
                Loading your typing passage...
            </div>

            <textarea
                id="input"
                placeholder="Start typing here..."
                disabled
                spellcheck="false"
            ></textarea>

            <button id="restart">New Test ↻</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

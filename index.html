
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeSprint — Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>Type<span>Sprint</span></h1>
            <p>Test your typing speed.</p>
            <p id="highScore">High Score: 0 WPM</p>
        </header>

        <section class="test-box">
            <div class="test-info">
                <span id="timer">60s</span>
                <span id="wpm">0 WPM</span>
                <span id="accuracy">100% Accuracy</span>
            </div>

            <div id="quote" class="quote"></div>
            <textarea
                id="input"
                placeholder="Start typing here..."
                disabled
                spellcheck="false"
            ></textarea>

            <button id="restart">New Test ↻</button>

            <div id="results" class="results" hidden>
    <h2>Test Completed!</h2>

    <div class="result-stats">
        <p>WPM: <span id="finalWpm">0</span></p>
        <p>Accuracy: <span id="finalAccuracy">0%</span></p>
        <p>Time: <span id="finalTime">0s</span></p>
    </div>

    <button id="tryAgain">Try Again</button>
</div>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
